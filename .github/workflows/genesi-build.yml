name: Build Genesi Code

# Builds the Genesi Code binary inside a CachyOS container (Arch-native, so it
# runs on Genesi OS) and uploads it as a downloadable artifact for testing on a
# Genesi OS VM. Mirrors the proven container/swap setup from the GenesiOS repo's
# publish-packages.yml.
#
# NOTE: GitHub disables Actions on forks by default — enable them once under the
# repo's Actions tab for this workflow to run.

on:
  push:
    branches: [genesi]
    paths:
      - 'app/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/genesi-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed so the build can publish a GitHub Release with the binary.
    permissions:
      contents: write
    env:
      # Whether the cross-repo dispatch token is configured (secrets can't be
      # referenced directly in a step `if:`, so surface it as an env flag here).
      HAS_DISPATCH_TOKEN: ${{ secrets.GENESIOS_DISPATCH_TOKEN != '' }}
    container:
      # cachyos-v3 ships CachyOS repos + a trusted keyring. Arch-native build ->
      # the resulting binary runs on Genesi OS (CachyOS-based).
      image: cachyos/cachyos-v3:latest
      # --privileged so we can swapon a backstop swapfile: a 60+ crate Rust
      # build (esp. the link step) can exhaust the runner's RAM. Same headroom
      # trick publish-packages.yml uses for the heavy Vulkan build.
      options: --privileged

    steps:
      - name: Install git in container
        # Needed before actions/checkout; --needed avoids reinstalling git on a
        # running pacman process (can deadlock). git-lfs is required because some
        # assets (fonts, imagery) are LFS-tracked and get embedded at build time.
        run: pacman -Sy --needed --noconfirm git git-lfs openssh

      - name: Checkout (genesi branch, with LFS)
        # git-lfs is installed in the step above, so the action can smudge LFS
        # assets (fonts under app/assets/bundled/fonts/**) during checkout. The
        # previous lfs:false + manual `git lfs pull` pulled ZERO objects on this
        # fork, so fonts embedded as pointers and the binary panicked at runtime
        # ("no asset exists at path bundled/fonts/hack/Hack-Italic.ttf").
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build headroom (overcommit + swap backstop)
        shell: bash
        run: |
          set -x
          sysctl -w vm.overcommit_memory=1 || echo "::warning::could not set overcommit"
          # Best-effort swap backstop — must NEVER fail the build. On 2026-06-16
          # (run #46) a 16G swapfile didn't fit the runner's disk: fallocate failed
          # and the dd fallback filled the disk ("No space left on device"), and
          # since the step shell runs with -e that killed the build before cargo
          # even started. Run #70 later proved 8G still starves the Rust release
          # target. Two build jobs plus 2G swap leave enough room for the .rlib
          # archives while retaining a memory-pressure backstop.
          if [ ! -e /ci-swapfile ]; then
            if fallocate -l 2G /ci-swapfile 2>/dev/null \
               || dd if=/dev/zero of=/ci-swapfile bs=1M count=2048 2>/dev/null; then
              chmod 600 /ci-swapfile
              mkswap /ci-swapfile
              swapon /ci-swapfile || echo "::warning::swapon failed — relying on overcommit"
            else
              echo "::warning::could not create swapfile (no disk space); relying on overcommit"
              rm -f /ci-swapfile
            fi
          fi
          swapon --show || true
          free -h || true

      - name: Install build deps
        shell: bash
        run: |
          set -euxo pipefail
          # Don't `-Syu` (upgrading pacman mid-CI can deadlock). DB refresh +
          # needed deps only, with retries for CachyOS CDN flakes.
          #
          # protoc links abseil at runtime; a partial `-Sy` can leave a stale
          # abseil-cpp whose soname no longer matches the freshly-pulled protobuf
          # (build fails: "libabsl_log_initialize.so.<ver>: cannot open shared
          # object file"). Force abseil-cpp + protobuf to the current repo version
          # together, in one transaction, so they stay in lockstep — two packages,
          # not `-Syu`, so no mid-CI pacman/glibc deadlock risk.
          install_deps() {
            pacman -Syy --noconfirm && \
            pacman -S --needed --noconfirm --overwrite='*' \
              base-devel git git-lfs mold cmake clang pkgconf python openssl \
              protobuf \
              fontconfig freetype2 libxkbcommon wayland libx11 libxcb \
              vulkan-icd-loader vulkan-headers mesa rustup && \
            pacman -S --noconfirm --overwrite='*' abseil-cpp protobuf
          }
          for attempt in 1 2 3 4 5; do
            if install_deps; then echo "deps installed (attempt $attempt)"; break; fi
            if [ "$attempt" = 5 ]; then echo "::error::deps failed (CachyOS CDN)"; exit 1; fi
            echo "::warning::deps attempt $attempt failed; retry in 30s"; sleep 30
          done
          # rust-toolchain.toml pins 1.92.0; install it explicitly so the first
          # cargo invocation doesn't pay for an implicit download mid-build.
          rustup toolchain install 1.92.0 --profile minimal -c rustfmt -c clippy

      - name: Ensure LFS assets materialized (fail fast)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs install --local || true
          git lfs pull || true
          f=app/assets/bundled/fonts/hack/Hack-Italic.ttf
          if [ ! -f "$f" ]; then echo "::error::missing $f"; exit 1; fi
          sz=$(stat -c%s "$f")
          echo "Hack-Italic.ttf = $sz bytes"
          # LFS pointer files are ~130 bytes; a real .ttf is tens of KB+.
          if [ "$sz" -lt 4096 ]; then
            echo "::error::LFS not materialized ($sz bytes = pointer). Fonts would embed as pointers and the binary would panic at runtime."
            head -c 300 "$f"; echo
            exit 1
          fi
          # Surface any pointer files still lurking under the embedded asset dir.
          ptrs=$(grep -rlI "git-lfs.github.com/spec" app/assets 2>/dev/null | wc -l || echo 0)
          echo "remaining LFS pointer files under app/assets: $ptrs"

      - name: Reclaim disk for release target
        shell: bash
        run: |
          set -euxo pipefail
          # Packages and LFS assets are materialized already, so these download
          # caches are duplicate data that the build no longer needs.
          rm -rf /var/cache/pacman/pkg/*
          rm -rf .git/lfs/objects
          echo "disk available before cargo build:"
          df -h /

      - name: Build Genesi Code (release)
        shell: bash
        env:
          # MUST be a release build: rust_embed only embeds the bundled assets
          # (fonts, svg, imagery) in release. A debug build reads them from the
          # COMPILE-TIME folder path at runtime, which doesn't exist on the
          # user's machine -> "no asset exists at path bundled/fonts/...". Release
          # also yields a smaller, optimized binary for distribution. LTO off +
          # more codegen units keeps peak RAM/time sane on the 16 GB runner.
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          CARGO_BUILD_JOBS: "2"
        run: cargo build --release --bin warp

      - name: Stage + compress artifact
        shell: bash
        run: |
          mkdir -p dist
          install -m755 target/release/warp dist/genesi-code.bin
          install -m755 resources/linux/launcher/genesi-code.sh dist/genesi-code
          # zstd-compressed tarball for the Release asset (consistent name so the
          # latest-release download URL is stable for the package installer).
          tar -C dist -caf dist/genesi-code-linux-x86_64.tar.zst genesi-code genesi-code.bin
          ls -lh dist/

      - name: Upload build artifact (login-only fallback)
        uses: actions/upload-artifact@v4
        with:
          name: genesi-code-linux-x86_64
          path: dist/genesi-code-linux-x86_64.tar.zst
          if-no-files-found: error

      - name: Publish GitHub Release
        # One Release per successful build (tag = run number, monotonic). The
        # asset name is constant, so the package installer can always pull
        # https://github.com/Genesi-OS/genesi-code/releases/latest/download/genesi-code-linux-x86_64.tar.zst
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.${{ github.run_number }}
          name: Genesi Code build ${{ github.run_number }}
          make_latest: true
          files: dist/genesi-code-linux-x86_64.tar.zst
          body: |
            Automated Genesi Code build from `${{ github.sha }}` (branch `genesi`).

            Install / run:
            ```bash
            tar xaf genesi-code-linux-x86_64.tar.zst
            chmod +x genesi-code
            ./genesi-code
            ```
            Release build (optimized, self-contained — assets embedded). Latest
            asset is always at the
            `releases/latest/download/genesi-code-linux-x86_64.tar.zst` URL.

      - name: Notify GenesiOS to republish [genesi-apps]
        # The GenesiOS publish-apps cron never fires (0 scheduled runs observed),
        # so ping it directly the instant a release lands: it rebuilds genesi-code
        # into the [genesi-apps] pacman repo so genesi-update and the package
        # installer see the new version immediately instead of staying stuck on an
        # old build. Requires a PAT on Genesi-OS/GenesiOS (scope: repo, or
        # fine-grained Contents:read-write + Actions:read-write) stored as the
        # GENESIOS_DISPATCH_TOKEN secret in THIS repo's settings. Skipped (not
        # failed) when the secret is absent, so the build still succeeds without it.
        if: ${{ env.HAS_DISPATCH_TOKEN == 'true' }}
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GENESIOS_DISPATCH_TOKEN }}
          repository: Genesi-OS/GenesiOS
          event-type: genesi-code-release
          client-payload: '{"tag": "v0.0.${{ github.run_number }}", "sha": "${{ github.sha }}"}'
